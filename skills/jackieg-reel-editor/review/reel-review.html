<meta charset="utf-8">
<title>Revisión de reel · JackieG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap">
<style>
/* JackieG Reel Editor review page, in Jackie's design: blush pink ground, oxblood maroon type, white rounded "sticker"
   boxes for the key word, wide-tracked mono labels with a ✷ bullet, white cards, maroon pills, sparkles and hearts.
   Colours sampled from her guide (pink #F6DEE3, maroon #72150E). Fonts: Outfit (headlines, text) + Space Mono (labels).
   One deliberate light look (her brand is pink), on purpose not following the system dark mode. */
:root{
  color-scheme:light;
  --pink:#F6DEE3; --pink-2:#F9E8EC; --pink-3:#EFC9D1; --blush:#F2A6B8; --white:#FFFFFF;
  --maroon:#72150E; --maroon-2:#8E2A20; --maroon-soft:rgba(114,21,14,.10); --ink:#4A0F0A; --muted:#8A4A44; --faint:#B98A86;
  --line:rgba(114,21,14,.14); --line-strong:rgba(114,21,14,.32); --charcoal:#2E2A2A;
  --now:rgba(242,166,184,.45); --cut-bg:#F1D4DA; --cut-fg:#B98A86; --auto:#B98A86;
  --keep:#2F7A4F; --change:#B26A00; --drop:#B3261E; --warn:#B26A00;
  --f-body:"Outfit",system-ui,-apple-system,sans-serif; --f-mono:"Space Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
body{background:var(--pink);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 120px;display:grid;grid-template-columns:340px minmax(0,1fr);gap:36px;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr);gap:22px}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:12px}
@media (max-width:820px){.side{position:static}}
.label,.brandline,.eyebrow{font:400 11px var(--f-mono);letter-spacing:.24em;text-transform:uppercase;color:var(--maroon)}
.label::before,.brandline::before,.eyebrow::before{content:"✷ ";letter-spacing:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.langbtn{font:700 11px var(--f-mono);letter-spacing:.16em;border:1.5px solid var(--maroon);background:var(--white);color:var(--maroon);border-radius:999px;padding:6px 12px;cursor:pointer}
.langbtn:hover{background:var(--maroon);color:var(--white)}
.hero{position:relative;padding-top:4px}
.hero .face{position:absolute;right:-10px;top:-14px;width:112px}   /* her sticker keeps its own baked-in shadow, on the same pink */
h1{font:600 30px/1.02 var(--f-body);letter-spacing:-.03em;margin:8px 0 0;color:var(--maroon);text-transform:lowercase;max-width:200px}
h1 .stk{display:inline-block;background:var(--white);border-radius:18px;padding:0 14px 6px;margin-top:6px;font-weight:800;font-size:1.9em;letter-spacing:-.05em;line-height:1.05;box-shadow:0 8px 24px rgba(114,21,14,.10)}
.spark{position:absolute;color:var(--maroon)} .spark.soft{color:var(--blush)}
.reel-name{font:400 12px var(--f-mono);color:var(--muted);margin:0;font-variant-numeric:tabular-nums}
.player{position:relative;border-radius:26px;overflow:hidden;background:#1a0d0b;border:6px solid var(--white);box-shadow:0 18px 44px rgba(114,21,14,.18);aspect-ratio:9/16;width:100%;max-width:330px;margin-inline:auto;container-type:inline-size;box-sizing:border-box}
@media (max-width:820px){.player{max-width:270px}}
.player video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.gbox{position:absolute;border:1.5px dashed var(--white);background:rgba(114,21,14,.28);border-radius:12px;display:flex;align-items:flex-start;justify-content:center;font:700 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);padding:5px;box-sizing:border-box;background-size:cover;background-position:top center}
.capov{position:absolute;left:5%;right:5%;overflow:visible;text-align:center;line-height:1.02;text-shadow:0 2px 10px rgba(0,0,0,.45)}
.capov .a{display:inline} .capov.ed .a{display:block;line-height:.95}
.capov .trs{display:block;font-size:.68em;margin-top:.12em;opacity:.92}
.clock{position:absolute;right:10px;bottom:10px;font:400 11px var(--f-mono);background:var(--white);color:var(--maroon);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums}
.scrub{display:flex;gap:10px;align-items:center}
.scrub input{flex:1;min-width:0;accent-color:var(--maroon)}
.mode{font-size:14px;color:var(--muted);margin:0}
.mode b{color:var(--maroon);font-weight:700}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.side .ctl{justify-content:center}
.savebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font:700 11px var(--f-mono);letter-spacing:.06em;border-radius:999px;padding:5px 12px;background:var(--white);color:var(--maroon)}
.pill.err{background:var(--maroon);color:var(--white)}
/* steps */
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:22px;padding:6px;border-radius:999px;background:var(--white);box-shadow:0 8px 24px rgba(114,21,14,.08)}
@media (max-width:640px){.tabs{border-radius:22px}}
.tab{font:600 14px var(--f-body);border:0;background:none;color:var(--maroon);border-radius:999px;padding:8px 14px;cursor:pointer;display:flex;gap:7px;align-items:center;transition:background .25s var(--ease),color .25s var(--ease);text-transform:lowercase}
.tab:hover{background:var(--maroon-soft)}
.tab .num{font:400 10px var(--f-mono);color:var(--faint)}
.tab[aria-selected="true"]{background:var(--maroon);color:var(--white)}
.tab[aria-selected="true"] .num{color:var(--pink-3)}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--blush)}
.steptitle{font:600 34px/1.05 var(--f-body);letter-spacing:-.03em;color:var(--maroon);margin:8px 0 12px;text-transform:lowercase;text-wrap:balance}
.steptitle .stk{display:inline-block;background:var(--white);border-radius:14px;padding:0 12px 4px;font-weight:800}
.lede{margin:0 0 12px;color:var(--ink);font-size:16px;max-width:66ch}
.lede b{color:var(--maroon);font-weight:700}
.chip{display:inline-block;background:var(--white);color:var(--maroon);font-weight:700;border-radius:8px;padding:0 7px}
.tally{font:400 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;margin:6px 0 16px;display:flex;gap:6px 18px;flex-wrap:wrap}
.tally b{color:var(--maroon);font-weight:700}
button.b,a.b{font:700 13px var(--f-body);border-radius:999px;padding:10px 18px;border:1.5px solid var(--maroon);background:var(--white);color:var(--maroon);cursor:pointer;transition:transform .2s var(--ease),background .2s var(--ease),color .2s var(--ease);text-transform:lowercase}
button.b:hover,a.b:hover{background:var(--maroon-soft)}
a.b{display:inline-block;text-decoration:none}
button.b.primary,a.b.primary{background:var(--maroon);color:var(--white)}
button.b.primary:hover,a.b.primary:hover{background:var(--maroon-2);transform:translateY(-1px)}
button.b.quiet{border-color:var(--line-strong);font-weight:600}
button.b:disabled{opacity:.4;cursor:default;transform:none}
button:focus-visible,.w:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--maroon);outline-offset:3px}
textarea,input[type=text]{font:inherit;font-size:16px;border-radius:16px;border:1.5px solid var(--line-strong);background:var(--white);color:var(--ink);padding:10px 14px;width:100%;box-sizing:border-box}
textarea::placeholder,input::placeholder{color:var(--faint)}
textarea{min-height:84px;resize:vertical}
.ts{font:400 11px var(--f-mono);color:var(--muted);background:none;border:0;cursor:pointer;padding:7px 0 0;text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.ts:hover{color:var(--maroon)}
.ts .src::before{content:attr(data-w) " ";opacity:.6}
.tc{font:400 11px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--maroon);white-space:nowrap}
.tc::before{content:attr(data-w) " ";opacity:.6}
.panel{background:var(--white);border-radius:26px;padding:16px 14px;box-shadow:0 10px 30px rgba(114,21,14,.07)}
/* cuts */
.sent{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;padding:7px 8px;border-radius:16px}
.sent:hover{background:var(--pink-2)}
.clipmark{font:400 11px var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--maroon);padding:14px 8px 4px;border-top:1.5px dashed var(--line-strong);margin-top:6px}
.clipmark::before{content:"✷ "}
.clipmark:first-child{border-top:0;margin-top:0;padding-top:4px}
.words{display:flex;flex-wrap:wrap;gap:3px;font-size:19px;line-height:1.55;user-select:none;-webkit-user-select:none;touch-action:pan-y;align-items:center;color:var(--ink)}
.w{padding:0 5px;border-radius:8px;cursor:pointer;transition:background .15s var(--ease)}
.w:hover{background:var(--pink)}
.w.now{background:var(--now);box-shadow:inset 0 -2px 0 var(--maroon)}
.w.cut{background:var(--cut-bg);color:var(--cut-fg);text-decoration:line-through;text-decoration-color:var(--maroon);text-decoration-thickness:2px}
.w.filler{color:var(--auto);text-decoration:line-through dotted;font-style:italic}
.w.filler.back{color:var(--ink);text-decoration:none;outline:1.5px solid var(--keep);outline-offset:-2px}
.pz{font:700 11px var(--f-mono);border:1.5px dashed var(--auto);color:var(--auto);background:none;border-radius:999px;padding:1px 8px;cursor:pointer}
.pz.kept{border-style:solid;border-color:var(--keep);color:var(--keep)}
/* graphics */
.cards{display:flex;flex-direction:column;gap:12px}
.card{display:grid;grid-template-columns:92px minmax(0,1fr);gap:16px;padding:14px;border-radius:24px;background:var(--white);border:1.5px solid transparent;box-shadow:0 10px 30px rgba(114,21,14,.07);transition:border-color .25s var(--ease)}
.card.now{border-color:var(--maroon)}
.card.dropped{opacity:.5}
.thumb{position:relative;width:92px;max-width:100%;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:var(--pink-3) center/cover}
.thumb .gbox{border-width:1px;font-size:0}
.approx{font:400 9px var(--f-mono);color:var(--faint);text-align:center;margin-top:4px;text-transform:uppercase;letter-spacing:.12em}
.card .kind{font:400 11px var(--f-mono);text-transform:uppercase;letter-spacing:.2em;color:var(--maroon)}
.card .kind::before{content:"✷ "}
.card .what{margin:3px 0 6px;color:var(--ink);font-weight:500}
.card .meta{font-size:13px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap;margin-bottom:10px}
.card .warnline{font-size:13px;color:var(--warn)}
.seg{display:inline-flex;border:1.5px solid var(--maroon);border-radius:999px;overflow:hidden;background:var(--white)}
.seg button{font:600 13px var(--f-body);background:none;border:0;padding:6px 14px;cursor:pointer;color:var(--maroon);text-transform:lowercase}
.seg button[aria-pressed="true"]{background:var(--maroon);color:var(--white)}
.card input{margin-top:10px}
/* captions */
.caps{display:flex;flex-direction:column;gap:2px}
.caprow{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:start;padding:6px 8px;border-radius:16px}
@media (max-width:520px){.caprow{grid-template-columns:60px minmax(0,1fr)}.caprow .tools{grid-column:2;justify-content:flex-start}}
.caprow.now{background:var(--now)}
.caprow.gone{opacity:.45}
.cw{display:flex;flex-wrap:wrap;gap:4px;font-size:18px;align-items:center;color:var(--ink)}
.cw .x{border:0;background:none;font:inherit;font-weight:700;color:var(--ink);padding:1px 7px;border-radius:8px;cursor:pointer}
.cw .x:hover{background:var(--pink)}
.cw .x.acc{color:var(--white);background:var(--maroon)}
.cw .flag{font-size:12px;color:var(--warn)}
.trl{flex-basis:100%;font-size:15px;color:var(--muted);border:0;background:none;text-align:left;padding:2px 7px;border-radius:8px;cursor:pointer;font-family:inherit}
.trl:hover{background:var(--pink);color:var(--ink)}
.trl b{color:var(--maroon);font-weight:700}
.trl::before{content:"→ ";opacity:.6}
.tools{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tools button{font:400 11px var(--f-mono);border:1.5px solid var(--line-strong);background:var(--white);color:var(--maroon);border-radius:999px;padding:4px 9px;cursor:pointer}
.tools button:hover{border-color:var(--maroon);background:var(--pink-2)}
/* sound & colour */
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.pair figure{margin:0;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:22px;background:var(--white)}
.pair img{border-radius:14px;width:100%;aspect-ratio:9/16;object-fit:cover;max-width:260px}
.pair figcaption{font:400 11px var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--maroon)}
.pair audio{width:100%}
h2{font:400 11px var(--f-mono);letter-spacing:.24em;text-transform:uppercase;color:var(--maroon);margin:26px 0 8px}
h2::before{content:"✷ "}
.cue{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:16px;background:var(--white);margin-bottom:6px}
.cue .what{font-size:14px}
.cue.off .what{text-decoration:line-through;color:var(--muted)}
/* preview */
.state{font-weight:600;padding:14px 18px;border-radius:20px;background:var(--white);color:var(--maroon);margin-bottom:14px}
.state.out{background:var(--maroon);color:var(--white)}
.state.ok{border:2px solid var(--keep);color:var(--keep)}
.rev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.notes{display:flex;flex-direction:column;gap:8px;margin-top:26px;padding:18px;border-radius:26px;background:var(--maroon);color:var(--white)}
.notes label{font-weight:700;color:var(--white);font-size:18px}
.notes textarea{border-color:transparent}
.notes .b{background:var(--white)}
.notes details{border-color:rgba(255,255,255,.35)}
.notes summary{color:var(--white)}
.notes .lede{color:var(--pink)}
.notes[hidden]{display:none}
details{margin-top:6px;border:1.5px solid var(--line);border-radius:16px;padding:10px 14px}
summary{cursor:pointer;font-weight:600;color:var(--maroon)}
.empty{padding:22px;border:1.5px dashed var(--line-strong);border-radius:20px;color:var(--muted);background:var(--pink-2)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:14px}
code{font:400 12px var(--f-mono);background:var(--charcoal);color:#F6DEE3;border-radius:8px;padding:2px 7px;word-break:break-all}
.next{display:flex;justify-content:flex-end;margin-top:18px}
.handle{grid-column:1/-1;text-align:center;font:400 10px var(--f-mono);letter-spacing:.3em;color:var(--maroon);opacity:.75;margin-top:28px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    if (nextLive) tool(T("merge"), T("mergeT"), () => mutate(() => {
      const arr = capsEditable(), a = arr[c.ci], b = arr[nextLive.ci];
      if (a.text || b.text) { a.text = [a.text || a.w.map(i => R.words[i].text).join(" "), b.text || b.w.map(i => R.words[i].text).join(" ")].join(" "); a.accText = []; }
      if (a.tr || b.tr) a.tr = [a.tr, b.tr].filter(Boolean).join(" ");
      a.w = a.w.concat(b.w); a.acc = (a.acc || []).concat(b.acc || []); arr.splice(nextLive.ci, 1);
    }));
    row.append(ts, cw, tools); box.appendChild(row);
  }
  const cm = $("#capmode"); cm.hidden = !R.captionLang; cm.textContent = "";
  if (R.captionLang) {
    const to = T("lang_" + R.captionLang.to) || R.captionLang.to;
    const lab = document.createElement("span"); lab.className = "mode"; lab.textContent = T("capLang") + ":"; cm.appendChild(lab);
    const seg = document.createElement("div"); seg.className = "seg"; seg.setAttribute("role", "group"); seg.setAttribute("aria-label", T("capLang"));
    for (const [k, label] of [["same", T("mSame")], ["translated", T("mTr")(to)], ["bilingual", T("mBi")]]) {
      const b = document.createElement("button"); b.type = "button"; b.className = "k"; b.textContent = label; b.setAttribute("aria-pressed", capMode() === k);
      b.addEventListener("click", () => mutate(() => { S.captionMode = k; }));
      seg.appendChild(b);
    }
    cm.appendChild(seg);
  }
  const acc = live.reduce((n, c) => n + c.words.filter(w => w.accent).length, 0);
  $("#captally").innerHTML = T("captally")(live.length, CAPS.length - live.length, acc);
}

// ---------- 4. sound & colour ----------
function renderSound() {
  const A = R.assets || {};
  const fig = (label, el) => { const f = document.createElement("figure"); const c = document.createElement("figcaption"); c.textContent = label; f.append(c, el); return f; };
  const au = u => { const a = document.createElement("audio"); a.controls = true; a.preload = "none"; a.src = u; return a; };
  const im = (u, alt) => { const i = document.createElement("img"); i.src = u; i.alt = alt; return i; };
  $("#audio").replaceChildren(...(A.audioOriginal ? [fig(T("orig"), au(A.audioOriginal)), fig(T("clean"), au(A.audioCleaned))] : [Object.assign(document.createElement("div"), { className: "empty", textContent: T("noAudio") })]));
  $("#colour").replaceChildren(...(A.colourBefore && R.grade ? [fig(T("orig"), im(A.colourBefore, T("imgBefore"))), fig(T("graded"), im(A.colourAfter, T("imgAfter")))] : [Object.assign(document.createElement("div"), { className: "empty", textContent: T("noGrade") })]));
  const cues = $("#cues"); cues.textContent = "";
  for (const g of GFX.filter(g => g.sfx && !g.gone && g.state !== "d")) {
    const off = !!S.sfxOff[g.id];
    const row = document.createElement("div"); row.className = "cue" + (off ? " off" : "");
    const t = document.createElement("span"); t.className = "tc"; t.textContent = fmt(g.start);
    const w = document.createElement("span"); w.className = "what"; w.textContent = `${g.sfx.name} · ${g.kind}`;
    const ctl = document.createElement("span"); ctl.className = "ctl";
    const play = document.createElement("button"); play.type = "button"; play.className = "b quiet"; play.textContent = T("listen");
    play.addEventListener("click", () => { const u = A.sfx?.[g.sfx.name]; if (!u) return; const a = new Audio(u); a.volume = Math.min(1, Math.pow(10, (g.sfx.db + 8) / 20)); a.play().catch(() => {}); });
    const tg = document.createElement("button"); tg.type = "button"; tg.className = "b quiet"; tg.textContent = off ? T("on") : T("off");
    tg.addEventListener("click", () => mutate(() => { if (off) delete S.sfxOff[g.id]; else S.sfxOff[g.id] = true; }));
    ctl.append(play, tg); row.append(t, w, ctl); cues.appendChild(row);
  }
}

// ---------- 5. preview ----------
function renderPreview() {
  const h = ReelCore.hash(decisions()), st = $("#bstate");
  st.className = "state";
  if (B?.url && B.hash === h) { st.textContent = T("upToDate")(new Date(B.at).toLocaleString(LANG === "en" ? "en" : "es")); st.classList.add("ok"); }
  else if (B?.url) { st.textContent = T("outdated"); st.classList.add("out"); }
  else if (S.buildRequest?.hash === h) st.textContent = T("requested");
  else st.textContent = T("noPreview");
  const revs = $("#revs"); revs.textContent = "";
  S.revisions.forEach((r, k) => {
    const row = document.createElement("div"); row.className = "rev";
    const t = document.createElement("button"); t.className = "ts"; t.type = "button"; t.innerHTML = `<span class="tc" data-w="${T("cutw")}">${fmt(r.t)}</span>`;
    t.addEventListener("click", () => { if (B?.url) { v.currentTime = r.t; v.play().catch(() => {}); } });
    const x = document.createElement("span"); x.textContent = r.text;
    const del = document.createElement("button"); del.type = "button"; del.className = "b quiet"; del.textContent = T("remove");
    del.addEventListener("click", () => mutate(() => S.revisions.splice(k, 1)));
    row.append(t, x, del); revs.appendChild(row);
  });
  if (!S.revisions.length) revs.innerHTML = `<div class="empty">${T("noNotes")}</div>`;
}
$("#build").addEventListener("click", () => mutate(() => { S.buildRequest = { hash: ReelCore.hash(decisions()), at: new Date().toISOString() }; }));
$("#revadd").addEventListener("click", () => {
  const text = $("#revtext").value.trim(); if (!text) { $("#revtext").focus(); return; }
  if (!B?.url) { pill(T("buildFirst"), true); return; }
  mutate(() => { S.revisions.push({ t: +v.currentTime.toFixed(2), text, hash: B.hash }); S.revisions.sort((a, b) => a.t - b.t); }); $("#revtext").value = "";
});

// ---------- 6. cover: a link to the thumbnail studio on their own computer ----------
function renderCover() {
  const box = $("#coverbox"); box.textContent = "";
  const url = /^http:\/\/(127\.0\.0\.1|localhost):\d+\//.test(R.thumbnailUrl || "") ? R.thumbnailUrl : null;
  const para = (...parts) => { const p = document.createElement("p"); p.className = "lede"; p.append(...parts); box.appendChild(p); return p; };
  const code = t => Object.assign(document.createElement("code"), { textContent: t });
  if (!url) { para(T("coverAsk")); return; }
  const a = Object.assign(document.createElement("a"), { className: "b primary", href: url, target: "_blank", rel: "noopener", textContent: T("coverOpen") });
  box.appendChild(Object.assign(document.createElement("div"), { className: "ctl" })).appendChild(a);
  para(T("coverA1"), code(url), T("coverA2"));
  para(T("coverB1"),
    ...(R.thumbnailCmd ? [T("coverB2"), code(R.thumbnailCmd)] : []), T("coverB3"));
}

function renderAll() {
  renderCuts(); renderGraphics(); renderCaptions(); renderSound(); renderPreview(); renderCover();
  const sent = { cuts: S.cut != null, graphics: Object.keys(S.board).length, captions: S.captions != null, sound: Object.keys(S.sfxOff).length };
  $$(".tab").forEach(b => { const d = b.querySelector(".dot"); if (d) d.hidden = !sent[b.dataset.tab]; });
}

// ---------- load ----------
let fontTag = null;
function setReel(data) {
  R = data;
  const css = R.fonts ? [["rb", R.fonts.body], ["ra", R.fonts.accent]].filter(f => f[1]).map(([n, u]) => `@font-face{font-family:${n};src:url(${u});font-weight:1 1000;font-display:swap}`).join("") : "";
  if (!fontTag) fontTag = document.head.appendChild(document.createElement("style"));   // brand fonts, so the caption preview uses the real faces
  fontTag.textContent = css;
}
const showName = () => { $("#reelname").textContent = `${R.title} · ${T("orig").toLowerCase()} ${fmt(R.srcDur)} → reel ${fmt(P.cutDur)}`; };
(async () => {
  applyStatic(); $("#reelname").textContent = T("loading");
  $("#langbtn").addEventListener("click", () => setLang(LANG === "en" ? "es" : "en"));
  const db = await window.claude?.use?.("db");
  if (!db) { pill(T("noDb"), true); $("#reelname").textContent = T("offline2"); return; }
  try {
    const rs = await db.doc("reel/current").get();
    if (!rs.exists) { $("#reelname").textContent = T("noReel"); pill(T("nothing"), true); return; }
    setReel(rs.data());
    if (!LANG && R.uiLang) { LANG = R.uiLang; applyStatic(); }
    ref = db.doc("review/current");
    const rv = await ref.get(); if (rv.exists) S = { ...blank(), ...JSON.parse(JSON.stringify(rv.data())) };
    // someone else (Claude, another tab) changed the decisions: take theirs instead of saving a stale copy over it
    ref.onSnapshot(s => {
      if (!s.exists || !R) return;
      const d = s.data(); if (d.updatedAt === mine || dirty) return;
      if (JSON.stringify(d) === JSON.stringify({ ...S })) return;
      S = { ...blank(), ...JSON.parse(JSON.stringify(d)) }; undo = []; $("#undo").disabled = true;
      recompute(); renderAll(); setPos(pos); pill(T("updDec"));
    }, () => {});
    let firstReel = true;
    db.doc("reel/current").onSnapshot(async s => {   // Claude loaded new footage or a new proposal: show it without a reload
      if (firstReel) { firstReel = false; return; }
      if (!s.exists) return;
      // an edit still waiting to save belongs to the old proposal: drop it, or it would bring back decisions Claude cleared
      clearTimeout(timer); dirty = false; await saving.catch(() => {});
      const sameClip = s.data().srcUrl === R.srcUrl;
      stopPlay(); setReel(s.data());
      const rv2 = await ref.get(); S = rv2.exists ? { ...blank(), ...JSON.parse(JSON.stringify(rv2.data())) } : blank();
      undo = []; $("#undo").disabled = true; $("#brand").value = S.brandRequest || "";
      recompute(); setPos(sameClip ? pos : 0); renderAll(); showTab(tab); showName();
      pill(sameClip ? T("updProp") : T("newClip"));
    }, () => {});
    db.doc("builds/latest").onSnapshot(s => { B = s.exists ? s.data() : null; if (R) renderPreview(); if (tab === "preview") showTab("preview"); }, () => {});
    recompute();
    showName(); setPos(0);
    $("#brand").value = S.brandRequest || "";
    renderAll(); showTab(["cuts", "graphics", "captions", "sound", "preview", "cover"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "cuts");
    pill(rv.exists ? T("loaded") : T("ready"));
  } catch (e) { pill(T("loadFail") + " (" + (e?.code || "error") + "). " + T("reload"), true); }
})();
</script>
