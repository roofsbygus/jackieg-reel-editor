# Weekly update PRs. Nothing merges by itself: review each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /skills/jackieg-reel-editor
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
